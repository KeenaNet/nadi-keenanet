services:
  nadi-3d-experience:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keenanet-nadi-3d
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    labels:
      - "coolify.managed=true"
      - "casaos.app_name=NADI 3D Experience"
      - "casaos.author=KeenaNet"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.2"
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
