<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var currentFetch = window.fetch;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return currentFetch;
              },
              set: function(fn) {
                currentFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e1) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(fn) {
                  currentFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e2) {}
          }
        } catch (e) {}

        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          var file = event.filename || '';
          if (
            file.indexOf('chrome-extension://') !== -1 ||
            msg.indexOf('Cannot set property fetch of #<Window>') !== -1 ||
            msg.indexOf('chrome-extension://') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var stack = (reason && (reason.stack || reason.message)) || '';
          if (stack.indexOf('chrome-extension://') !== -1 || stack.indexOf('Cannot set property fetch') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
